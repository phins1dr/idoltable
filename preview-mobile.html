<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile preview · Idol Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; background: #16181f; }
  body { padding: 20px; display: flex; gap: 20px; align-items: flex-start; font-family: system-ui, sans-serif; }
  .phone {
    width: 390px; height: 844px; border-radius: 26px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); background: #0a0c10; flex: 0 0 auto;
  }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  .note { color: #9aa2b4; font-size: 12px; max-width: 260px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="phone"><iframe id="frame" title="모바일 미리보기"></iframe></div>
  <p class="note">390 × 844 미리보기. 주소 뒤 <code>#?ch=...</code> 처럼 붙이면 그 링크로 열립니다.</p>
<script>
  var q = (location.hash.slice(1) || '').replace(/^\?/, '');
  document.getElementById('frame').src = './index.html?pv=1' + (q ? '&' + q : '');
</script>
</body>
</html>
